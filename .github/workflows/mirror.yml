name: split-repo-source-guard
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/mirror.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify authoritative split manifest
        shell: bash
        env:
          EXPECTED_REPO: unclehowell/cedwyn-wiki
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/unclehowell/cedwyn/main/split-repos.json" \
            -o /tmp/split-repos.json
          python3 -c 'import json,os; d=json.load(open("/tmp/split-repos.json")); xs=[x for x in d.get("apps",[]) if x.get("repo")==os.environ["EXPECTED_REPO"]]; assert len(xs)==1, "manifest entry missing or duplicated"; a=xs[0]; assert a.get("mode")=="split-repo" and a.get("deploy")=="repo", "manifest does not confirm dedicated-repo deployment"; print("Authoritative manifest confirms the dedicated repository as source of truth.")'
      - name: Confirm no legacy mirror is needed
        run: 'echo "No mirror: this app is deployed from its dedicated repository."'
